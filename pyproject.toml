[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeaudit"
version = "0.0.1"
description = "A lightweight, dependency-free code review coverage tracker — mark what's actually been read, exclude human-written code, track coverage toward 100%."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Jacob Schwartz", email = "jaschwa@umich.edu" },
]
keywords = ["code-review", "audit", "coverage", "cli", "developer-tools"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
codeaudit = "codeaudit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codeaudit"]
